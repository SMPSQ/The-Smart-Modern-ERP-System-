<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Future Tech — Login</title>
<meta name="theme-color" content="#0A1628" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #0A1628;
    --navy2: #0F2A4A;
    --gold: #C9A227;
    --gold-l: #E8D48B;
    --blue: #1D4ED8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body.login-body {
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    background: #F1F5F9;
  }
  .brand-panel {
    background: linear-gradient(145deg, #06101C 0%, #0A1628 40%, #0F2A4A 100%);
    color: #fff;
    padding: 2.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
    border-right: 4px solid var(--gold);
  }
  .brand-panel::before {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,162,39,0.2), transparent 70%);
    top: -80px; right: -80px;
  }
  .brand-panel img.logo {
    width: 140px; height: 140px;
    object-fit: contain;
    background: #fff;
    border-radius: 28px;
    padding: 8px;
    border: 3px solid var(--gold);
    box-shadow: 0 12px 40px rgba(201,162,39,0.35);
    position: relative;
    z-index: 1;
  }
  .brand-panel h1 {
    margin-top: 1.5rem;
    font-size: 1.85rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    position: relative; z-index: 1;
  }
  .brand-panel h1 span { color: var(--gold); }
  .brand-panel .tag {
    margin-top: 0.5rem;
    color: #94A3B8;
    font-size: 0.95rem;
    position: relative; z-index: 1;
  }
  .brand-feats {
    display: flex; flex-wrap: wrap; gap: 0.6rem;
    justify-content: center;
    margin-top: 2rem;
    position: relative; z-index: 1;
  }
  .brand-feats span {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(201,162,39,0.35);
    color: var(--gold-l);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.45rem 0.85rem;
    border-radius: 999px;
  }
  .login-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background: linear-gradient(180deg, #F8FAFC, #EEF2F7);
  }
  .login-card {
    background: #fff;
    width: 100%;
    max-width: 420px;
    border-radius: 20px;
    padding: 2rem 1.85rem 1.75rem;
    box-shadow: 0 20px 60px rgba(10,22,40,0.12);
    border: 1px solid #E2E8F0;
  }
  .login-card .card-logo {
    display: flex; justify-content: center; margin-bottom: 0.75rem;
  }
  .login-card .card-logo img {
    width: 64px; height: 64px; object-fit: contain;
    background: #fff; border-radius: 14px; padding: 4px;
    border: 2px solid var(--gold);
  }
  .login-card h2 {
    text-align: center;
    font-size: 1.25rem;
    color: var(--navy);
    font-weight: 800;
  }
  .login-card .sub {
    text-align: center;
    color: #64748B;
    font-size: 0.85rem;
    margin: 0.35rem 0 1.35rem;
  }
  .field { margin-bottom: 0.95rem; }
  .field label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    color: #475569;
    margin-bottom: 0.35rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .field input, .field select {
    width: 100%;
    padding: 0.8rem 1rem;
    border: 1.5px solid #E2E8F0;
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #F8FAFC;
    transition: 0.2s;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--gold);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(201,162,39,0.2);
  }
  #login-btn {
    width: 100%;
    margin-top: 0.5rem;
    padding: 0.9rem;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #0A1628, #1D4ED8);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(29,78,216,0.3);
  }
  #login-btn:hover { filter: brightness(1.08); }
  #login-btn:disabled { opacity: 0.7; cursor: wait; }
  #login-error {
    color: #DC2626;
    font-size: 0.85rem;
    text-align: center;
    min-height: 1.2em;
    margin-top: 0.65rem;
  }
  .secure {
    text-align: center;
    font-size: 0.72rem;
    color: #94A3B8;
    margin-top: 0.85rem;
  }
  .links { text-align: center; margin-top: 1rem; }
  .links a { color: #1D4ED8; font-size: 0.85rem; font-weight: 600; text-decoration: none; }
  #pwa-install-btn {
    width: 100%; margin-top: 0.75rem;
    padding: 0.7rem; border-radius: 12px;
    border: 2px solid var(--gold);
    background: var(--navy); color: var(--gold-l);
    font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .role-row {
    display: flex; gap: 0.4rem; margin-bottom: 1rem; flex-wrap: wrap;
  }
  .role-row button {
    flex: 1; min-width: 70px;
    padding: 0.45rem; border-radius: 8px;
    border: 1px solid #E2E8F0; background: #F8FAFC;
    font-size: 0.72rem; font-weight: 600; cursor: pointer;
    font-family: inherit; color: #475569;
  }
  .role-row button.active {
    background: var(--navy); color: var(--gold-l); border-color: var(--gold);
  }
  @media (max-width: 860px) {
    body.login-body { grid-template-columns: 1fr; }
    .brand-panel { padding: 1.75rem 1.25rem; min-height: 280px; }
    .brand-panel img.logo { width: 96px; height: 96px; }
    .brand-panel h1 { font-size: 1.35rem; }
  }
</style>
</head>
<body class="login-body" data-root="./">

<aside class="brand-panel">
  <img class="logo" src="icons/logo-future-tech.png" alt="Future Tech" />
  <h1>FUTURE TECH<br><span>PUBLIC SCHOOL</span></h1>
  <p class="tag">Qamber · Nurturing Minds, Building Futures</p>
  <div class="brand-feats">
    <span>Modern Education</span>
    <span>Skilled Teachers</span>
    <span>Digital Learning</span>
    <span>Bright Future</span>
  </div>
</aside>

<main class="login-panel">
  <div class="login-card">
    <div class="card-logo">
      <img src="icons/logo-future-tech.png" alt="" />
    </div>
    <h2>Future Tech Public School</h2>
    <p class="sub">Login to Your Account</p>

    <div class="role-row" id="role-row">
      <button type="button" data-role="admin" class="active">Admin</button>
      <button type="button" data-role="staff">Staff</button>
      <button type="button" data-role="parent">Parent</button>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="login-email">Username / Email</label>
        <input id="login-email" type="text" autocomplete="username" placeholder="Admin email or staff username" required />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="Password" required />
      </div>
      <button type="submit" id="login-btn">Login</button>
      <p id="login-error"></p>
    </form>
    <p class="secure">Admin: email · Staff: username · Cloud sync when online</p>
    <button type="button" id="pwa-install-btn" hidden>Install App</button>
    <div class="links"><a href="parent.html">Parent Portal →</a></div>
  </div>
</main>

<script type="module">
  import { auth } from './js/firebase-config.js';
  import { signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';
  import { loginStaff, getStaffSession, clearStaffSession } from './js/staff-auth.js';

  document.querySelectorAll('#role-row button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#role-row button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      try { sessionStorage.setItem('erp-role', btn.dataset.role); } catch (_) {}
    });
  });

  const staff = getStaffSession();
  onAuthStateChanged(auth, (user) => {
    if (user || staff) window.location.href = 'dashboard.html';
  });
  if (staff) window.location.href = 'dashboard.html';

  const form = document.getElementById('login-form');
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    // Staff username (no @)
    if (!email.includes('@')) {
      const result = await loginStaff(email, password);
      if (result.ok) {
        window.location.href = 'dashboard.html';
        return;
      }
      errEl.textContent = result.error || 'Invalid username or password.';
      btn.disabled = false;
      btn.textContent = 'Login to Dashboard';
      return;
    }

    try {
      clearStaffSession();
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errEl.textContent = err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password'
        ? 'Invalid email or password.'
        : (err.message || 'Login failed.');
      btn.disabled = false;
      btn.textContent = 'Login to Dashboard';
    }
  });
</script>
<script src="js/sw-register.js"></script>
</body>
</html>
