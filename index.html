<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FKC Group — Sign In</title>
<meta name="theme-color" content="#0B1D3A" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body" data-root="">

<div class="login-card">
  <div class="crest">FKC</div>
  <h1>THE SMART MODERN GROUP ERP</h1>
  <p class="tagline">One login for School · Trading Academy · Educational Academy</p>

  <form id="login-form">
    <label for="login-email">Email</label>
    <input type="email" id="login-email" required autocomplete="username" />

    <label for="login-password">Password</label>
    <input type="password" id="login-password" required autocomplete="current-password" />

    <button type="submit">Sign in</button>
    <p class="login-status" id="login-status"></p>
  </form>
</div>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/db.js"></script>
<script type="module" src="js/sync.js"></script>
<script type="module" src="js/auth.js"></script>
<script src="js/sw-register.js"></script>
</body>
</html>
