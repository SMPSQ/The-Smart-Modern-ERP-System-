<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Educational Academy — ERP</title>
<meta name="theme-color" content="#0A1628" />
<link rel="manifest" href="../../manifest.json" />
<link rel="icon" href="../../icons/icon.svg" />
<link rel="stylesheet" href="../../css/style.css" />
</head>
<body class="dash-body" data-root="../../">

<header class="dash-header">
  <div class="dash-header__brand">
    <span class="crest-sm">FKC</span>
    <span>The Smart Modern Educational Academy</span>
  </div>
  <div class="dash-header__right">
    <span class="sync-pill" id="sync-pill">● checking…</span>
    <span class="user-chip" id="user-chip">—</span>
    <button class="ghost-btn" id="logout-btn">Sign out</button>
  </div>
</header>

<main class="module-main">
  <a class="back-link" href="../../dashboard.html">← Back to Master Dashboard</a>

  <!-- TUTORS -->
  <section class="panel">
    <h3>📚 Add Tutor</h3>
    <form id="tutor-form" class="inline-form">
      <input type="text" id="tutor-name" placeholder="Tutor name" required />
      <input type="text" id="tutor-subject" placeholder="Subject / Expertise" />
      <input type="tel" id="tutor-phone" placeholder="Phone" />
      <button type="submit">Add Tutor</button>
    </form>
    <ul id="tutor-list" class="data-list"></ul>
  </section>

  <!-- CLASSES -->
  <section class="panel">
    <h3>Create Class / Batch</h3>
    <form id="class-form" class="inline-form">
      <input type="text" id="class-name" placeholder="Class name" required />
      <select id="class-tutor">
        <option value="">Select tutor (optional)</option>
      </select>
      <input type="text" id="class-timing" placeholder="Timing" />
      <input type="number" id="class-fee" placeholder="Monthly fee (Rs)" min="0" />
      <button type="submit">Add Class</button>
    </form>
    <ul id="class-list" class="data-list"></ul>
  </section>

  <!-- ENROLLMENTS -->
  <section class="panel">
    <h3>Student Enrollment</h3>
    <form id="enroll-form" class="inline-form">
      <input type="text" id="enroll-name" placeholder="Student name" required />
      <select id="enroll-class" required>
        <option value="">Select class</option>
      </select>
      <input type="tel" id="enroll-phone" placeholder="Phone" />
      <button type="submit">Enroll</button>
    </form>
    <ul id="enroll-list" class="data-list"></ul>
  </section>
</main>

<script type="module" src="../../js/firebase-config.js"></script>
<script type="module" src="../../js/db.js"></script>
<script type="module" src="../../js/sync.js"></script>
<script type="module" src="../../js/auth.js"></script>
<script type="module" src="academy.js"></script>
<script src="../../js/sw-register.js"></script>
</body>
</html>
