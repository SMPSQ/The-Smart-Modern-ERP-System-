<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FKC Trading Academy — FKC Group ERP</title>
<link rel="manifest" href="../../manifest.json" />
<link rel="stylesheet" href="../../css/style.css" />
</head>
<body class="dash-body">

  <header class="dash-header">
    <div class="dash-header__brand">
      <span class="crest-sm">FKC</span>
      <span>FKC Trading Academy</span>
    </div>
    <div class="dash-header__right">
      <span class="sync-pill" id="sync-pill">● syncing…</span>
      <span class="user-chip" id="user-chip">—</span>
      <button class="ghost-btn" id="logout-btn">Sign out</button>
    </div>
  </header>

  <main class="dash-main">
    <a class="module-back" href="../../dashboard.html">← Back to reception</a>

    <div class="tab-row">
      <button class="tab-btn active" data-tab="batches">Batches</button>
      <button class="tab-btn" data-tab="enrollments">Enrollments</button>
    </div>

    <!-- BATCHES TAB -->
    <section id="tab-batches" class="tab-panel">
      <div class="panel">
        <h3>Add Batch</h3>
        <form id="batch-form" class="panel-form">
          <div>
            <label for="b-name">Batch name</label>
            <input type="text" id="b-name" placeholder="e.g. Evening Batch A" required />
          </div>
          <div>
            <label for="b-gender">Class</label>
            <select id="b-gender" required>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>
          <div>
            <label for="b-timing">Timing</label>
            <input type="text" id="b-timing" placeholder="e.g. Mon–Fri 5–7pm" required />
          </div>
          <div>
            <label for="b-instructor">Instructor</label>
            <input type="text" id="b-instructor" />
          </div>
          <button type="submit">Add batch</button>
        </form>
      </div>

      <div class="panel">
        <h3>All Batches</h3>
        <table class="data-table">
          <thead><tr><th>Batch</th><th>Class</th><th>Timing</th><th>Instructor</th><th>Enrolled</th><th></th></tr></thead>
          <tbody id="batches-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- ENROLLMENTS TAB -->
    <section id="tab-enrollments" class="tab-panel" hidden>
      <div class="panel">
        <h3>Enroll a Trader</h3>
        <form id="enroll-form" class="panel-form">
          <div>
            <label for="e-name">Student name</label>
            <input type="text" id="e-name" required />
          </div>
          <div>
            <label for="e-contact">Contact</label>
            <input type="text" id="e-contact" />
          </div>
          <div>
            <label for="e-batch">Batch</label>
            <select id="e-batch" required></select>
          </div>
          <button type="submit">Enroll</button>
        </form>
      </div>

      <div class="panel">
        <h3>All Enrollments</h3>
        <div class="month-filter">
          <label for="e-filter">Show batch:</label>
          <select id="e-filter"><option value="all">All batches</option></select>
        </div>
        <table class="data-table">
          <thead><tr><th>Student</th><th>Contact</th><th>Batch</th><th>Enrolled on</th><th></th></tr></thead>
          <tbody id="enrollments-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="../../js/firebase-config.js"></script>
  <script type="module" src="../../js/db.js"></script>
  <script type="module" src="../../js/sync.js"></script>
  <script type="module" src="../../js/auth.js"></script>
  <script type="module" src="trading.js"></script>
  <script src="../../js/sw-register.js"></script>
</body>
</html>
