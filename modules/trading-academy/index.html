<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FKC Trading Academy — FKC Group ERP</title>
<meta name="theme-color" content="#0B1D3A" />
<link rel="manifest" href="../../manifest.json" />
<link rel="icon" href="../../icons/icon.svg" />
<link rel="stylesheet" href="../../css/style.css" />
</head>
<body class="dash-body" data-root="../../">

<header class="dash-header">
  <div class="dash-header__brand">
    <span class="crest-sm">FKC</span>
    <span>FKC Trading Academy</span>
  </div>
  <div class="dash-header__right">
    <span class="sync-pill" id="sync-pill">● checking connection…</span>
    <span class="user-chip" id="user-chip">—</span>
    <button class="ghost-btn" id="logout-btn">Sign out</button>
  </div>
</header>

<main class="module-main">
  <p><a class="back-link" href="../../dashboard.html">&larr; Back to reception</a></p>

  <section class="panel">
    <h3>Add Batch</h3>
    <form id="batch-form" class="inline-form">
      <input type="text" id="batch-name" placeholder="Batch name (e.g. Evening-1)" required />
      <select id="batch-gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
      <input type="text" id="batch-timing" placeholder="Timing (e.g. 5–7 PM)" />
      <input type="text" id="batch-instructor" placeholder="Instructor" />
      <button type="submit">Add batch</button>
    </form>
  </section>

  <section class="panel">
    <h3>Batches</h3>
    <ul id="batch-list" class="data-list"></ul>
  </section>

  <section class="panel">
    <h3>Enroll Trader</h3>
    <form id="enrollment-form" class="inline-form">
      <select id="enrollment-batch" required></select>
      <input type="text" id="trader-name" placeholder="Trader name" required />
      <input type="text" id="trader-phone" placeholder="Phone" />
      <button type="submit">Enroll</button>
    </form>
  </section>

  <section class="panel">
    <h3>Enrollments</h3>
    <div class="filter-row">
      <select id="batch-filter">
        <option value="">All batches</option>
      </select>
    </div>
    <ul id="enrollment-list" class="data-list"></ul>
  </section>
</main>

<script type="module" src="../../js/firebase-config.js"></script>
<script type="module" src="../../js/db.js"></script>
<script type="module" src="../../js/sync.js"></script>
<script type="module" src="../../js/auth.js"></script>
<script type="module" src="js/trading.js"></script>
<script src="../../js/sw-register.js"></script>
</body>
</html>
