<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FKC Trading Academy — ERP</title>
<meta name="theme-color" content="#0A1628" />
<link rel="manifest" href="../../manifest.json" />
<link rel="icon" href="../../icons/icon.svg" />
<link rel="stylesheet" href="../../css/style.css" />
</head>
<body class="dash-body" data-root="../../">

<header class="dash-header">
  <div class="dash-header__brand">
    <span class="crest-sm">FKC</span>
    <span>FKC Trading Academy</span>
  </div>
  <div class="dash-header__right">
    <span class="sync-pill" id="sync-pill">● checking…</span>
    <span class="user-chip" id="user-chip">—</span>
    <button class="ghost-btn" id="logout-btn">Sign out</button>
  </div>
</header>

<main class="module-main">
  <a class="back-link" href="../../dashboard.html">← Back to Master Dashboard</a>

  <!-- BATCHES -->
  <section class="panel">
    <h3>📈 Create Batch</h3>
    <form id="batch-form" class="inline-form">
      <input type="text" id="batch-name" placeholder="Batch name" required />
      <select id="batch-gender">
        <option value="Mixed">Mixed</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
      <input type="text" id="batch-timing" placeholder="Timing (e.g. 6-8 PM)" />
      <input type="text" id="batch-instructor" placeholder="Instructor" />
      <button type="submit">Add Batch</button>
    </form>
    <ul id="batch-list" class="data-list"></ul>
  </section>

  <!-- ENROLLMENTS -->
  <section class="panel">
    <h3>Student Enrollment</h3>
    <form id="enroll-form" class="inline-form">
      <input type="text" id="enroll-name" placeholder="Student name" required />
      <select id="enroll-batch" required>
        <option value="">Select batch</option>
      </select>
      <input type="tel" id="enroll-phone" placeholder="Phone" />
      <button type="submit">Enroll</button>
    </form>
    <ul id="enroll-list" class="data-list"></ul>
  </section>

  <!-- TRADING JOURNAL -->
  <section class="panel">
    <h3>Trading Journal</h3>
    <form id="journal-form" class="inline-form">
      <select id="journal-student" required>
        <option value="">Select student</option>
      </select>
      <input type="text" id="journal-symbol" placeholder="Symbol (e.g. EURUSD)" required />
      <select id="journal-side">
        <option value="Buy">Buy</option>
        <option value="Sell">Sell</option>
      </select>
      <input type="number" id="journal-entry" placeholder="Entry price" step="any" required />
      <input type="number" id="journal-exit" placeholder="Exit price" step="any" />
      <input type="number" id="journal-lots" placeholder="Lots" step="0.01" value="0.1" />
      <button type="submit">Log Trade</button>
    </form>
    <ul id="journal-list" class="data-list"></ul>
    <p class="hint">Profit/Loss is calculated automatically when exit price is entered.</p>
  </section>
</main>

<script type="module" src="../../js/firebase-config.js"></script>
<script type="module" src="../../js/db.js"></script>
<script type="module" src="../../js/sync.js"></script>
<script type="module" src="../../js/auth.js"></script>
<script type="module" src="trading.js"></script>
<script src="../../js/sw-register.js"></script>
</body>
</html>
