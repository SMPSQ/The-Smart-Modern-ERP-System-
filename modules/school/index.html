<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>The Smart Modern Public School — FKC Group ERP</title>
<meta name="theme-color" content="#0B1D3A" />
<link rel="manifest" href="../../manifest.json" />
<link rel="icon" href="../../icons/icon.svg" />
<link rel="stylesheet" href="../../css/style.css" />
</head>
<body class="dash-body" data-root="../../">

<header class="dash-header">
  <div class="dash-header__brand">
    <span class="crest-sm">FKC</span>
    <span>The Smart Modern Public School</span>
  </div>
  <div class="dash-header__right">
    <span class="sync-pill" id="sync-pill">● checking connection…</span>
    <span class="user-chip" id="user-chip">—</span>
    <button class="ghost-btn" id="logout-btn">Sign out</button>
  </div>
</header>

<main class="module-main">
  <p><a class="back-link" href="../../dashboard.html">&larr; Back to reception</a></p>

  <section class="panel">
    <h3>Add Student</h3>
    <form id="student-form" class="inline-form">
      <input type="text" id="student-name" placeholder="Student name" required />
      <input type="text" id="student-class" placeholder="Class (e.g. 6-B)" />
      <input type="text" id="student-guardian" placeholder="Guardian name" />
      <input type="text" id="student-phone" placeholder="Phone" />
      <button type="submit">Add student</button>
    </form>
  </section>

  <section class="panel">
    <h3>Students</h3>
    <ul id="student-list" class="data-list"></ul>
  </section>

  <section class="panel">
    <h3>New Fee Challan</h3>
    <form id="challan-form" class="inline-form">
      <select id="challan-student" required></select>
      <input type="month" id="challan-month" required />
      <input type="number" id="challan-amount" placeholder="Amount (Rs)" min="0" required />
      <button type="submit">Create challan</button>
    </form>
  </section>

  <section class="panel">
    <h3>Fee Challans</h3>
    <div class="filter-row">
      <input type="month" id="month-filter" />
      <select id="status-filter">
        <option value="all">All statuses</option>
        <option value="Paid">Paid</option>
        <option value="Unpaid">Unpaid</option>
      </select>
    </div>
    <ul id="challan-list" class="data-list"></ul>
    <p class="hint">Tap a challan's status badge to toggle Paid / Unpaid.</p>
  </section>
</main>

<script type="module" src="../../js/firebase-config.js"></script>
<script type="module" src="../../js/db.js"></script>
<script type="module" src="../../js/sync.js"></script>
<script type="module" src="../../js/auth.js"></script>
<script type="module" src="js/school.js"></script>
<script src="../../js/sw-register.js"></script>
</body>
</html>
