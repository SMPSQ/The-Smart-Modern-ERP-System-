<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parent Portal — Smart Modern ERP</title>
<meta name="theme-color" content="#0A1628" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
  body { background: #EEF1F5; font-family: Inter, system-ui, sans-serif; margin: 0; min-height: 100vh; }
  .top {
    background: #0A1628; color: #fff; padding: 1rem 1.25rem;
    border-bottom: 3px solid #C9A227; text-align: center;
  }
  .top h1 { margin: 0; font-size: 1.15rem; color: #fff; }
  .top p { margin: 0.25rem 0 0; color: #E8D48B; font-size: 0.8rem; }
  .wrap { max-width: 520px; margin: 1.5rem auto; padding: 0 1rem 2rem; }
  .card {
    background: #fff; border-radius: 12px; padding: 1.25rem;
    box-shadow: 0 4px 16px rgba(10,22,40,0.07); border: 1px solid #EEF1F5; margin-bottom: 1rem;
  }
  .card h2 { margin: 0 0 0.85rem; font-size: 1rem; color: #0A1628; border-bottom: 2px solid #C9A227; padding-bottom: 0.35rem; display: inline-block; }
  input {
    width: 100%; padding: 0.7rem 0.85rem; border: 1px solid #E2E6ED; border-radius: 8px;
    font-size: 0.95rem; margin-bottom: 0.65rem; font-family: inherit;
  }
  button.primary {
    width: 100%; background: #0A1628; color: #fff; border: none; padding: 0.75rem;
    border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; font-family: inherit;
  }
  .result-item {
    padding: 0.75rem; border: 1px solid #E2E6ED; border-radius: 8px; margin-bottom: 0.5rem; font-size: 0.85rem;
  }
  .result-item strong { color: #0A1628; }
  .muted { color: #8B93A1; font-size: 0.8rem; }
  .back { display: block; text-align: center; margin-top: 1rem; color: #5A6270; font-size: 0.85rem; }
</style>
</head>
<body>
  <div class="top">
    <h1>Parent Portal</h1>
    <p>View your child's fees &amp; attendance</p>
  </div>
  <div class="wrap">
    <div class="card">
      <h2>Find Student</h2>
      <p class="muted" style="margin-top:0">Enter the phone number registered at admission.</p>
      <input type="tel" id="parent-phone" placeholder="03XX-XXXXXXX" />
      <button class="primary" id="parent-search">Search</button>
    </div>
    <div class="card" id="results" style="display:none">
      <h2>Results</h2>
      <div id="results-body"></div>
    </div>
    <a class="back" href="index.html">← Staff Login</a>
  </div>
  <script type="module">
    import { getAllLocal } from './js/db.js';

    document.getElementById('parent-search').addEventListener('click', async () => {
      const phone = (document.getElementById('parent-phone').value || '').replace(/\D/g, '');
      if (phone.length < 10) { alert('Enter a valid phone number'); return; }

      const students = await getAllLocal('students');
      const matched = students.filter(s => {
        const p = String(s.phone || s.guardianContact || '').replace(/\D/g, '');
        return p.includes(phone) || phone.includes(p);
      });

      const box = document.getElementById('results');
      const body = document.getElementById('results-body');
      box.style.display = 'block';

      if (!matched.length) {
        body.innerHTML = '<p class="muted">No student found for this number on this device.</p>';
        return;
      }

      const challans = await getAllLocal('feeChallans');
      const attendance = await getAllLocal('attendance');

      body.innerHTML = matched.map(s => {
        const fees = challans.filter(c => c.studentId === s.id || c.studentName === s.name);
        const unpaid = fees.filter(c => (c.status || '').toLowerCase() !== 'paid');
        const att = attendance.filter(a => a.studentId === s.id).slice(0, 10);
        const present = att.filter(a => a.status === 'Present').length;
        return `
          <div class="result-item">
            <strong>${s.name || '—'}</strong>
            <div class="muted">${s.className || s.course || ''} · ${s.module || ''}</div>
            <div style="margin-top:0.4rem">Unpaid challans: <strong>${unpaid.length}</strong> / Total: ${fees.length}</div>
            <div>Recent attendance shown: ${att.length} (Present: ${present})</div>
          </div>
        `;
      }).join('');
    });
  </script>
</body>
</html>
